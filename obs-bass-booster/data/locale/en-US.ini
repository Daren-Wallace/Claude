BassBooster="Bass Booster"
Module.Description="Adds, restores and synthesises bass on any OBS audio source."
Intro="Puts bass back into thin audio. Start with a preset, then fine-tune. Use Bypass to compare."

Preset="Preset"
Preset.Tooltip="Factory starting points. Moving any control switches this to Custom."
Preset.Subtle="Subtle Warmth"
Preset.Voice="Voice Body"
Preset.Music="Music Boost"
Preset.Restore="Restore Missing Bass (phone / Bluetooth / thin mic)"
Preset.Extreme="Extreme"
Preset.Custom="Custom"

Bypass="Bypass (compare with original)"
Bypass.Tooltip="Passes the audio through untouched, with a short click-free crossfade."

Group.Boost="Bass Boost"
Group.Boost.Tooltip="Low-shelf EQ: turns up all frequencies below the corner frequency."
ShelfGain="Boost"
ShelfGain.Tooltip="How much to raise the bass. Start around +6 dB. Negative values cut bass."
ShelfFreq="Corner Frequency"
ShelfFreq.Tooltip="Everything below this frequency is boosted. 80-120 Hz for deep bass, 150-250 Hz for voice body."
ShelfQ="Shape"
ShelfQ.Tooltip="0.71 is a smooth, natural shelf. Higher values add a resonant bump just above the corner."

Group.Punch="Punch"
Group.Punch.Tooltip="A focused bell boost that adds thump or chest to one region of the low end."
PunchGain="Punch Boost"
PunchGain.Tooltip="Gain of the bell. Negative values remove boominess."
PunchFreq="Punch Frequency"
PunchFreq.Tooltip="Centre of the bell. 50-80 Hz for kick-drum thump, 100-150 Hz for voice chest."
PunchQ="Punch Width (Q)"
PunchQ.Tooltip="Higher = narrower. 1.0 is a good musical default."

Group.Harmonics="Harmonic Restoration (rebuilds missing bass)"
Group.Harmonics.Tooltip="Rebuilds a missing fundamental from the harmonics that survived. Use this when the bass is completely gone, not just quiet."
HarmonicsAmount="Amount"
HarmonicsAmount.Tooltip="How much regenerated bass to add."
HarmonicsDrive="Drive / Warmth"
HarmonicsDrive.Tooltip="Adds extra harmonics so bass is audible on small speakers and earbuds. Higher = warmer and grittier."
HarmonicsLow="Source Band Low"
HarmonicsLow.Tooltip="Lowest frequency still present in your audio. For phone or Bluetooth audio, 250-300 Hz."
HarmonicsHigh="Source Band High"
HarmonicsHigh.Tooltip="Top of the band analysed for harmonics. Roughly 3x the low edge works well."

Group.Sub="Sub-Octave Generator (adds deep bass)"
Group.Sub.Tooltip="Creates brand-new bass one octave below the input, like an analogue subharmonic synthesiser."
SubAmount="Amount"
SubAmount.Tooltip="Level of the generated sub bass."
SubFreq="Target Frequency"
SubFreq.Tooltip="Where the new bass lives. Lower = deeper rumble, higher = more audible on small speakers."
SubTightness="Tightness"
SubTightness.Tooltip="Higher = shorter, punchier sub that follows the source closely. Lower = longer, smoother sub."

Group.Protection="Protection"
Group.Protection.Tooltip="Keeps inaudible rumble from wasting headroom."
RumbleFreq="Rumble Filter"
RumbleFreq.Tooltip="24 dB/octave high-pass that removes inaudible infrasonic energy and DC."

Group.Limiter="Limiter (prevents clipping)"
Group.Limiter.Tooltip="Zero-latency peak limiter. Bass boosts add a lot of level; this keeps your meter out of the red."
LimiterCeiling="Ceiling"
LimiterCeiling.Tooltip="The output never goes louder than this. -1 dB is a safe default."
LimiterRelease="Release"
LimiterRelease.Tooltip="How fast the level recovers after a loud peak. Longer = smoother, shorter = louder."

Group.Output="Output"
Group.Output.Tooltip="Overall levels and blend with the original signal."
InputGain="Input Trim"
InputGain.Tooltip="Gain applied before processing. Use it if the source is very quiet or very hot."
Mix="Mix (Dry / Wet)"
Mix.Tooltip="100% = fully processed, 0% = original audio. Use it for parallel processing."
OutputGain="Output Gain"
OutputGain.Tooltip="Gain applied after processing, before the limiter."

Help="Open User Guide"
