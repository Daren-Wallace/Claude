InstrumentalIsolator="Instrumental Isolator (Vocal Remover)"
Module.Description="Removes vocals in real time with zero latency, leaving the instrumental."
Intro="Removes centre-panned vocals from stereo music with zero latency. Works on stereo sources; mono sources only get the pitch remover."

Preset="Preset"
Preset.Tooltip="Factory starting points. Changing any control switches this to Custom."
Preset.Karaoke="Karaoke (balanced)"
Preset.Gentle="Gentle (keeps more ambience)"
Preset.Aggressive="Aggressive (deepest removal)"
Preset.MusicBed="Live Stream Music Bed (talk over music)"
Preset.Vocals="Vocals Only (acapella)"
Preset.Custom="Custom"

OutputMode="Output"
OutputMode.Tooltip="Instrumental keeps everything except the vocal. Vocals Only outputs the extracted vocal instead."
OutputMode.Instrumental="Instrumental (vocals removed)"
OutputMode.Vocals="Vocals only"

Bypass="Bypass (compare with original)"
Bypass.Tooltip="Passes the audio through untouched, with a short click-free crossfade."

Group.Removal="Vocal Removal"
Group.Removal.Tooltip="How much of the centre-panned vocal to remove."
Strength="Strength"
Strength.Tooltip="0-50 % blends from none to the estimated vocal. Above 50 % removes more than the estimate, for deeper removal at some cost to ambience."
CentreWidth="Centre Width"
CentreWidth.Tooltip="Narrow protects reverb and stereo ambience. Wide also removes content that is close to the centre."
Response="Response Time"
Response.Tooltip="How quickly the removal follows the music. Shorter tracks fast vocals; longer sounds smoother."

Group.Protection="Protection"
Group.Protection.Tooltip="Keeps centre-panned bass, kick drum, cymbals and drum hits intact."
ProtectLow="Protect Bass Below"
ProtectLow.Tooltip="Everything below this frequency (bass guitar, kick drum) is never removed."
ProtectHigh="Protect Highs Above"
ProtectHigh.Tooltip="Everything above this frequency (cymbals, air) is never removed."
TransientProtect="Drum Hit Protection"
TransientProtect.Tooltip="Briefly relaxes removal on sudden hits, so centre-panned snare and kick keep their punch."

Group.Pitch="Pitch-Tracked Vocal Remover"
Group.Pitch.Tooltip="Follows the singer's pitch and notches out its harmonics. Adds removal on top of the main engine and is the only part that helps on mono sources."
PitchAmount="Amount"
PitchAmount.Tooltip="Depth of the pitch-tracked notches."
PitchHarmonics="Harmonics"
PitchHarmonics.Tooltip="How many harmonics of the voice to notch out. More is stronger but colours instruments more."
VoiceLow="Lowest Voice Pitch"
VoiceLow.Tooltip="Lowest singing pitch to track. Around 80 Hz for male voices."
VoiceHigh="Highest Voice Pitch"
VoiceHigh.Tooltip="Highest singing pitch to track. Around 1000 Hz covers soprano."

Group.Output="Output"
Group.Output.Tooltip="Stereo width and level of the result."
StereoWidth="Stereo Width"
StereoWidth.Tooltip="100 % is unchanged. Above 100 % widens what remains, which can fill the hole left by the vocal."
AutoMakeup="Auto Level Makeup (with limiter)"
AutoMakeup.Tooltip="Restores the loudness lost by removing the vocal (up to +6 dB). A zero-latency limiter keeps it from clipping."
OutputGain="Output Gain"
OutputGain.Tooltip="Final level adjustment."

Help="Open User Guide"
